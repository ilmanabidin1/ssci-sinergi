# Deploy SSCI ke server sendiri (Biznet Gio).
# Aktif hanya bila variabel repositori DEPLOY_ENABLED bernilai "true", supaya push ke main
# tidak gagal sebelum server siap. Image dibangun di sini lalu dikirim langsung ke server lewat SSH,
# jadi server tidak perlu menyimpan kredensial GitHub atau registry.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
# Variables: DEPLOY_ENABLED, VITE_DEMO_MODE (opsional)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Periksa kode
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm test

      - name: Bangun image
        run: |
          docker build \
            --build-arg VITE_DEMO_MODE="${{ vars.VITE_DEMO_MODE || 'false' }}" \
            -f deploy/Dockerfile -t "ssci-sinergi:${GITHUB_SHA::12}" -t ssci-sinergi:latest .
          docker save "ssci-sinergi:${GITHUB_SHA::12}" ssci-sinergi:latest | gzip > ssci-image.tar.gz
          ls -lh ssci-image.tar.gz

      - name: Siapkan SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Kirim dan jalankan
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh deploy/restore.sh deploy/migrate-from-railway.sh "$TARGET:/opt/ssci/"
          $SSH "$TARGET" 'gunzip | docker load' < ssci-image.tar.gz
          $SSH "$TARGET" "cd /opt/ssci && \
            export SSCI_IMAGE=ssci-sinergi:${GITHUB_SHA::12} && \
            docker compose run --rm migrate && \
            docker compose up -d --remove-orphans && \
            docker image prune -f"

      - name: Periksa kesehatan
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          for i in $(seq 1 20); do
            if $SSH "$TARGET" "cd /opt/ssci && docker compose exec -T app node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""; then
              echo "Aplikasi sehat."; exit 0
            fi
            sleep 6
          done
          echo "Aplikasi tidak menjawab pemeriksaan kesehatan." >&2
          $SSH "$TARGET" "cd /opt/ssci && docker compose logs --tail 80 app" || true
          exit 1
